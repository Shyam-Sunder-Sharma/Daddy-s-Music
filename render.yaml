services:
  - type: web
    name: daddys-music
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --chdir backend --worker-class gthread --workers 1 --threads 32 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DADDY_MUSIC_DATA_DIR
        value: /tmp/.daddys_music_data
